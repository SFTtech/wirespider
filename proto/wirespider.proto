syntax = "proto3";
package wirespider;

service Wirespider {
    rpc getAddresses (AddressRequest) returns (AddressReply);
    rpc getEvents (EventsRequest) returns (stream Event);

    // --- manage ---
    // users
    rpc createUser (CreateUserRequest) returns (CreateUserReply);
    rpc deleteUser (DeleteUserRequest) returns (DeleteUserReply);
    rpc changeUser (ChangeUserRequest) returns (ChangeUserReply);

    // peers
    rpc addPeer (AddPeerRequest) returns (AddPeerReply);
    rpc deletePeer (DeletePeerRequest) returns (DeletePeerReply);
    rpc changePeer (ChangePeerRequest) returns (ChangePeerReply);

    // routes
    rpc addRoute (Route) returns (AddRouteReply);
    rpc delRoute (Route) returns (DelRouteReply);
}

message CreateUserRequest {
    string name = 1;
    uint32 permissions = 2;
}

message CreateUserReply {}

message DeleteUserRequest {
    string name = 1;
}

message DeleteUserReply {}

message ChangeUserRequest {
    string name = 1;
    oneof what {
        uint32 permission_level = 2;
    }
}

message ChangeUserReply {}

message AddressRequest {
    bytes wg_public_key = 1;
    Endpoint endpoint = 2;
    NodeFlags node_flags = 3;
    NatType nat_type = 4;
    repeated IP local_ips = 5;
    uint32 local_port = 6;
}

message AddressReply {
    repeated Network address = 1;
    repeated Network overlay_ips = 2;
}

message PeersRequest {}

message PeersReply {
    repeated Peer peers = 1;
}

message RoutesRequest {}

message RoutesReply {
    repeated Route routes = 1;
}

message EventsRequest {
    uint64 start_event = 1;
}


message AddPeerRequest {
    string name = 1;
    repeated Network internal_ip = 2;
    int32 permissions = 3;
}

message AddPeerReply {
    bytes token = 1;
}

message DeletePeerRequest {
    PeerIdentifier id = 1;
}

message DeletePeerReply {}

message ChangePeerRequest {
    PeerIdentifier id = 1;
    oneof what {
        uint32 permission_level = 2;
        Endpoint endpoint = 3;
        // Transfer ownership of this node to the named user. Admin-only.
        string owner = 4;
    }
}

message ChangePeerReply {}

message AddRouteReply {}

message DelRouteReply {}

message PeerIdentifier {
    oneof identifier {
        bytes token = 1;
        bytes public_key = 2;
        string name = 3;
    }
}

enum EventType {
    NEW = 0;
    CHANGED = 1;
    DELETED = 2;
}

message NodeFlags {
    bool monitor = 1;
    bool relay = 2;
}

enum NatType {
    NO_NAT = 0;
    FULL_CONE = 1;
    RESTRICTED_CONE = 2;
    PORT_RESTRICTED_CONE = 3;
    SYMMETRIC = 4;
}

message Event {
    EventType type = 1;
    uint64 id = 2;
    oneof target {
        Route route = 3;
        Peer peer = 4;
    }
}

message Peer {
    bytes wg_public_key = 1;
    oneof endpoint {
        Endpoint addr = 2;
    }
    repeated Network allowed_ips = 3;
    string name = 4;
    NodeFlags node_flags = 5;
    NatType nat_type = 6;
    repeated Network overlay_ips = 7;
    repeated IP tunnel_ips = 8;
    repeated IP local_ips = 9;
    uint32 local_port = 10;
}

message Endpoint {
    IP ip = 1;
    uint32 port = 2;
}



message Route {
    Network to = 2;
    IP via = 3;
}

message IP {
    oneof type {
        fixed32 ipv4 = 1;
        bytes ipv6 = 2;
    }
}

message Network {
    IP ip = 1;
    uint32 prefix_len = 2;
}
// --- raft ---

service Raft {
    rpc vote (SignedRaftVoteRequest) returns (SignedRaftVoteResponse);
    rpc append (SignedRaftAppendRequest) returns (SignedRaftAppendResponse);
    rpc snapshot (stream SignedRaftSnapshotChunk) returns (SignedRaftSnapshotResponse);
}

// Envelope for a signed raft RPC payload.
//
// `payload` is the JSON serialization of the openraft request; `signature` is
// the ed25519 signature of the sending node's raft key over the payload bytes
// and `payload_type` binds the signature to one RPC kind, preventing
// cross-type replay. The receiver verifies against the enrolled node keys.
message SignedRaftPayload {
    bytes payload = 1;
    bytes signature = 2;
    string payload_type = 3;
    bytes signer = 4;
}

message SignedRaftVoteRequest {
    SignedRaftPayload payload = 1;
}

message SignedRaftVoteResponse {
    SignedRaftPayload payload = 1;
}

message SignedRaftAppendRequest {
    SignedRaftPayload payload = 1;
}

message SignedRaftAppendResponse {
    SignedRaftPayload payload = 1;
}

message SignedRaftSnapshotChunk {
    SignedRaftPayload header = 1;
    bytes data = 2;
    bool done = 3;
}

message SignedRaftSnapshotResponse {
    SignedRaftPayload payload = 1;
}

// Operator join request: a new server presents its raft pubkey and advertised
// address to an existing member, which adds it as learner if it is the leader.
service RaftControl {
    rpc join (RaftJoinRequest) returns (RaftJoinResponse);
    rpc promote (RaftPromoteRequest) returns (RaftPromoteResponse);
    rpc leave (RaftLeaveRequest) returns (RaftLeaveResponse);
}

message RaftLeaveRequest {
    bytes pubkey = 1;
}

message RaftLeaveResponse {}

message RaftJoinRequest {
    bytes pubkey = 1;
    string advertise = 2;
}

message RaftJoinResponse {
    bool added = 1;
    // Public keys of all current cluster members. The joining node stores
    // them as its bootstrap allowlist: it cannot replicate-in membership
    // before it accepts signed RPCs, and it cannot accept signed RPCs from
    // members it does not know.
    repeated bytes members = 2;
}

message RaftPromoteRequest {
    bytes pubkey = 1;
}

message RaftPromoteResponse {}
