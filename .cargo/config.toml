[target.x86_64-unknown-linux-musl]
# The musl build is used for the container based integration tests: the node
# image is alpine based, therefore the binary must be statically linked.
rustflags = ["-C", "target-feature=+crt-static"]

[env]
# The C toolchain must be the musl cross compiler: the host gcc compiles the
# bundled sqlite3 against glibc headers, which fails to link on musl
# (undefined *64 symbols). The plain binary names resolve through PATH:
# install `musl-tools` on Debian/Ubuntu or the musl cross toolchain of your
# distribution.
CC_x86_64_unknown_linux_musl = "x86_64-unknown-linux-musl-gcc"
AR_x86_64_unknown_linux_musl = "x86_64-unknown-linux-musl-ar"
# musl needs _LARGEFILE64_SOURCE for the *64 syscall wrappers sqlite3 uses.
CFLAGS_x86_64_unknown_linux_musl = "-D_LARGEFILE64_SOURCE"
